name: Deploy DEV container

on:
  workflow_run:
    workflows: ["Verify static harness"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy after recovery verification
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: nownow-games-dev-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/isak-ialogics/nownow-games
  DEPLOY_HOST: nownow.dev.mplace.co.za

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source-sha.outputs.sha }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Select verified source
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then ref="$VERIFIED_SHA"; else ref="$REQUESTED_REF"; fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.selection.outputs.ref }}

      - name: Record immutable source SHA
        id: source-sha
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.source-sha.outputs.sha }}

      - name: Resolve pushed manifest digest
        id: image
        env:
          SHA: ${{ steps.source-sha.outputs.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$SHA" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    # This repository's self-hosted runner is the DEV Swarm manager.
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pinned DEV image and deploy
        env:
          SHA: ${{ needs.build.outputs.sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:$SHA@$DIGEST"
          env_file=/opt/ial-deploy/stacks/nownow-games/.env.dev
          tmp_file="$(mktemp "${env_file}.XXXXXX")"
          trap 'rm -f "$tmp_file"' EXIT
          grep -v '^NOWNOW_IMAGE=' "$env_file" > "$tmp_file"
          printf 'NOWNOW_IMAGE=%s\n' "$image" >> "$tmp_file"
          chmod 600 "$tmp_file"
          mv "$tmp_file" "$env_file"
          /opt/ial-deploy/deploy.sh nownow-games --env dev

      - name: Verify Swarm, health check, and internal Traefik route
        shell: bash
        run: |
          set -euo pipefail
          service=dev-nownow-games_static
          test "$(docker service ls --filter "name=$service" --format '{{.Replicas}}')" = '1/1'
          container="$(docker ps -q --filter "label=com.docker.swarm.service.name=$service")"
          test -n "$container"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          curl --fail --silent --show-error --resolve "$DEPLOY_HOST:443:127.0.0.1" "https://$DEPLOY_HOST/" -o /dev/null
