name: Publish DEV image

# A green `main` push verification publishes the DEV container to GHCR with the
# repository's short-lived GITHUB_TOKEN. The existing environment automation
# watches that package and deploys it to nownow.dev.mplace.co.za.

on:
  workflow_run:
    workflows: ["Verify static harness"]
    branches: [main]
    types: [completed]
concurrency:
  group: nownow-games-dev-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/isak-ialogics/nownow-games

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.source-sha.outputs.sha }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Record immutable source SHA
        id: source-sha
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR with repository-scoped token
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and publish image (immutable SHA tag + moving dev tag)
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.source-sha.outputs.sha }}
            ${{ env.IMAGE_NAME }}:dev

      - name: Resolve pushed manifest digest
        id: image
        env:
          SHA: ${{ steps.source-sha.outputs.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$SHA" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Summarize published image
        env:
          SHA: ${{ steps.source-sha.outputs.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Published DEV image to GHCR"
            echo ""
            echo "- Immutable: \`$IMAGE_NAME:$SHA\`"
            echo "- Moving: \`$IMAGE_NAME:dev\`"
            echo "- Digest: \`$DIGEST\`"
            echo ""
            echo "Existing automation deploys this image to https://nownow.dev.mplace.co.za."
          } >> "$GITHUB_STEP_SUMMARY"
