name: Promote approved OCI manifest to PROD

# Manual only: this workflow retags an already accepted immutable manifest.
# It never checks out an application ref for a rebuild and never runs on a
# branch event. Keep execute=false for preflight; execute=true is restricted to
# main and still requires release approval plus an authorised owner.

on:
  workflow_dispatch:
    inputs:
      approved_digest:
        description: Exact independently approved sha256 digest
        required: true
        type: string
      expected_previous_digest:
        description: PROD alias digest captured immediately before dispatch
        required: true
        type: string
      previous_runtime_identity:
        description: Immutable PROD service image captured before dispatch
        required: true
        type: string
      previous_runtime_replicas:
        description: PROD running/desired replicas captured before dispatch
        required: true
        type: string
      execute:
        description: Retag PROD after preflight (false performs no mutation)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nownow-games-prod-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main' || inputs.execute == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out promotion tooling
        uses: actions/checkout@v7.0.1

      - name: Set up repository Node version
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Log in to GHCR with established publisher authority
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: isak-ialogics
          password: ${{ secrets.IAL_GHCR_TOKEN }}

      - name: Set up Docker Buildx manifest tooling
        uses: docker/setup-buildx-action@v4.0.0

      - name: Validate and promote exact manifest
        env:
          APPROVED_DIGEST: ${{ inputs.approved_digest }}
          EXPECTED_PREVIOUS_DIGEST: ${{ inputs.expected_previous_digest }}
          PREVIOUS_RUNTIME_IDENTITY: ${{ inputs.previous_runtime_identity }}
          PREVIOUS_RUNTIME_REPLICAS: ${{ inputs.previous_runtime_replicas }}
          EXECUTE_PROMOTION: ${{ inputs.execute }}
          RECEIPT_PATH: ${{ runner.temp }}/prod-promotion-receipt.json
        run: |
          set -euo pipefail
          args=(
            promote
            --approved-digest "$APPROVED_DIGEST"
            --expected-previous-digest "$EXPECTED_PREVIOUS_DIGEST"
            --previous-runtime-identity "$PREVIOUS_RUNTIME_IDENTITY"
            --previous-runtime-replicas "$PREVIOUS_RUNTIME_REPLICAS"
            --receipt "$RECEIPT_PATH"
          )
          if [ "$EXECUTE_PROMOTION" = true ]; then args+=(--execute); fi
          node scripts/prod-oci-release.mjs "${args[@]}"

      - name: Preserve redacted transaction receipt
        if: always()
        env:
          RECEIPT_PATH: ${{ runner.temp }}/prod-promotion-receipt.json
        run: |
          if test -f "$RECEIPT_PATH"; then
            {
              echo '### PROD OCI promotion receipt'
              echo ''
              echo '<pre>'
              cat "$RECEIPT_PATH"
              echo '</pre>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No receipt was created; promotion did not pass preflight.' >> "$GITHUB_STEP_SUMMARY"
          fi
