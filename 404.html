<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="The requested NowNow Games page could not be found. Browse the current original browser games instead."
    />
    <meta name="theme-color" content="#101211" />
    <title>Page Not Found | NowNow Games</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 20rem; min-height: 100vh; margin: 0; display: grid; color: #f8f7f2; background: #101211; place-items: center; }
      main { width: min(100% - 2rem, 42rem); padding: clamp(2rem, 8vw, 5rem); background: #191c1a; border: 1px solid #343936; border-radius: 1.5rem; }
      p { color: #a7aaa6; line-height: 1.65; }
      .code { margin: 0 0 1rem; color: #c8ff3d; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 { max-width: 10ch; margin: 0; font-size: clamp(2.8rem, 12vw, 5.5rem); line-height: 0.9; letter-spacing: -0.06em; }
      a { display: inline-flex; min-height: 3rem; margin-top: 1rem; padding: 0.75rem 1.1rem; align-items: center; color: #101211; background: #c8ff3d; border-radius: 999px; font-weight: 800; }
      a:focus-visible { outline: 3px solid #f8f7f2; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 / page not found</p>
      <h1>That page slipped away.</h1>
      <p>
        The address may have changed, but the current NowNow games are ready to
        play from the collection.
      </p>
      <a href="/">Browse all games</a>
    </main>
  </body>
</html>
