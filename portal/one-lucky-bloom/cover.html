<!doctype html>
<html lang="en">
  <head>

    <title>One Lucky Bloom cover</title>
    <style>
      *{box-sizing:border-box}html,body{width:630px;height:500px;margin:0;overflow:hidden}body{position:relative;color:#fff7e2;background:radial-gradient(circle at 77% 16%,#754985 0 8%,#52325f 28%,transparent 46%),linear-gradient(145deg,#21172b,#17121e);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.copy{position:absolute;z-index:2;left:48px;top:48px;width:360px}.kicker{margin:0 0 13px;color:#f5a878;font-size:15px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:78px;line-height:.84;letter-spacing:-.065em}.deck{width:325px;margin:24px 0 0;color:#cfbecf;font-size:18px;line-height:1.42}.branch{position:absolute;right:-24px;bottom:-12px;width:335px;height:390px}.branch path{fill:none;stroke:#92704f;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}.branch .twig{stroke:#66866d;stroke-width:10}.bloom{position:absolute;right:119px;top:76px;width:70px;height:70px;filter:drop-shadow(0 0 20px #c697d4aa)}.bloom i{position:absolute;left:24px;top:3px;width:23px;height:39px;border-radius:70% 40%;background:#c697d4;transform-origin:50% 32px}.bloom i:nth-child(2){transform:rotate(72deg)}.bloom i:nth-child(3){transform:rotate(144deg)}.bloom i:nth-child(4){transform:rotate(216deg)}.bloom i:nth-child(5){transform:rotate(288deg)}.lanes{position:absolute;right:34px;bottom:30px;display:flex;gap:8px}.lanes span{display:grid;width:46px;height:46px;border:1px solid #c6aec9;border-radius:9px;background:#21172bdd;font-weight:850;place-items:center}.lanes span:nth-child(3){color:#21172b;background:#ffe9b5;border-color:#ffe9b5}
    </style>
  </head>
